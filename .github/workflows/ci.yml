name: DevPilot Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, devpilot-stitch-ui, 'phase-*' ]
  pull_request:
    branches: [ main, master, devpilot-stitch-ui ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeCheck (tsc)
        run: npx tsc --noEmit

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Dependency Security Check
        run: npm audit --audit-level=critical || true

      - name: Run Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  container-build:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: devpilot-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
