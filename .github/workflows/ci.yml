name: DevPilot Production CI

on:
  push:
    branches: [ main, master, 'phase-*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test, TypeCheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeCheck (tsc)
        run: npx tsc --noEmit

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Run Production Build
        run: npm run build
        env:
          NODE_ENV: production
